<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="popup.css" />
</head>

<body>
    <div class="container">
        <header class="header">
            <div class="plugin">
                <img src="../icons/icon48.png" alt="logo" class="logo" />
                <h1>IC Helper Manual</h1>
            </div>
        </header>

        <div class="content" id="content">
            <!-- 配置输入 -->
            <div class="config-card">
                <div class="config-card-row">
                    <div class="input-group">
                        <label for="environment">环境名:</label>
                        <input type="text" id="environment" placeholder="请输入环境名" />
                        <span class="error-text" id="environmentError"></span>
                    </div>
                </div>
            </div>

            <!-- 插件Container -->
            <div class="status-card">
                <div class="status-card-flex">
                    <div class="status-left">
                        <div class="status-icon active"></div>
                        <span>自动获取采集任务&自动上报采集数据: </span>
                        <span class="status-text active">自动</span>
                    </div>
                    <label class="switch">
                        <input type="checkbox" id="statusToggle" checked />
                        <span class="slider round"></span>
                    </label>
                </div>
            </div>
            <div class="info-container">
                <div class="info-item">
                    <span class="label" style="width: 70px">当前时间:</span>
                    <span class="value" id="currentTime"></span>
                </div>
            </div>
        </div>

        <footer class="footer">
            <span>版本 4.0.11</span>
        </footer>
    </div>
    <script src="popup.js"></script>
</body>

</html>
