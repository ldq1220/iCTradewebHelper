<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="popup.css">
</head>

<body>
    <div class="container">
        <header class="header">
            <div class="plugin">
                <img src="../icons/icon48.png" alt="logo" class="logo">
                <h1>IC Helper Mobile</h1>
            </div>
        </header>

        <div class="content" id="content">
            <!-- 配置输入 -->
            <div class="config-card">
                <div class="config-card-row">
                    <div class="input-group">
                        <label for="environment">环境名:</label>
                        <input type="text" id="environment" placeholder="请输入环境名">
                        <span class="error-text" id="environmentError"></span>
                    </div>
                    <div class="input-group">
                        <label for="account">账号:</label>
                        <input type="text" id="account" placeholder="请输入账号">
                        <span class="error-text" id="accountError"></span>
                    </div>
                    <div class="input-group">
                        <label for="password">密码:</label>
                        <input type="password" id="password" placeholder="请输入密码">
                        <span class="error-text" id="passwordError"></span>
                    </div>
                </div>

                <div class="config-card-row">
                    <div class="input-group">
                        <label for="loopSecond">循环时间s:</label>
                        <input type="number" id="loopSecond" placeholder="请输入循环秒数">
                    </div>
                    <div class="input-group">
                        <label for="minPauseTime">最小暂停时间s:</label>
                        <input type="number" id="minPauseTime" placeholder="请输入最小暂停时间">
                    </div>
                    <div class="input-group">
                        <label for="maxPauseTime">最大暂停时间s:</label>
                        <input type="number" id="maxPauseTime" placeholder="请输入最大暂停时间">
                    </div>
                </div>
            </div>


            <!-- 插件Container -->
            <div class="status-card">
                <div class="status-card-flex">
                    <div class="status-left">
                        <div class="status-icon active"></div>
                        <span>插件运行状态: </span>
                        <span class="status-text active">正在运行</span>
                    </div>
                    <label class="switch">
                        <input type="checkbox" id="statusToggle" checked>
                        <span class="slider round"></span>
                    </label>
                </div>
            </div>
            <div class="info-container">
                <div class="info-section">
                    <h2>当前页面信息</h2>
                    <div class="info-item">
                        <span class="label">域名:</span>
                        <span class="value" id="domain">-</span>
                    </div>
                    <div class="info-item">
                        <span class="label">参数:</span>
                        <span class="value" id="query">-</span>
                    </div>
                </div>
                <div class="info-section">
                    <h2>上次运行状态</h2>
                    <div class="info-item">
                        <span class="label">时间:</span>
                        <span class="value" id="lastRunTime"></span>
                    </div>
                    <div class="info-item">
                        <span class="label" style="width: 70px;">当前时间:</span>
                        <span class="value" id="currentTime"></span>
                    </div>
                </div>
            </div>
        </div>

        <footer class="footer">
            <span>版本 2.0.3</span>
        </footer>
    </div>
    <script src="popup.js"></script>
</body>

</html>
