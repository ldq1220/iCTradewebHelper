<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="popup.css">
</head>

<body>
    <div class="container">
        <header class="header">
            <div class="plugin">
                <img src="../icons/icon48.png" alt="logo" class="logo">
                <h1>IC Helper</h1>
            </div>
        </header>

        <div class="content" id="content">
            <!-- 配置输入 -->
            <div class="config-card">
                <div class="input-group">
                    <label for="companyIds">公司IDs:</label>
                    <input type="text" id="companyIds" placeholder="请输入公司ID数组">
                    <span class="error-text" id="idsError"></span>
                </div>
                <div class="input-group">
                    <label for="token">Token:</label>
                    <input type="password" id="token" placeholder="请输入token">
                    <span class="error-text" id="tokenError"></span>
                </div>
                <div class="input-group">
                    <label for="limit">Limit:</label>
                    <input type="number" id="limit" placeholder="数量">
                    <span class="error-text" id="limitError"></span>
                </div>
            </div>

            <!-- 插件Container -->
            <div class="status-card">
                <div class="status-card-flex">
                    <div class="status-left">
                        <div class="status-icon active"></div>
                        <span>插件运行状态: </span>
                        <span class="status-text active">正在运行</span>
                    </div>
                    <label class="switch">
                        <input type="checkbox" id="statusToggle" checked>
                        <span class="slider round"></span>
                    </label>
                </div>
            </div>
            <div class="info-container">
                <div class="info-section">
                    <h2>当前页面信息</h2>
                    <div class="info-item">
                        <span class="label">域名:</span>
                        <span class="value" id="domain">-</span>
                    </div>
                    <div class="info-item">
                        <span class="label">参数:</span>
                        <span class="value" id="query">-</span>
                    </div>
                </div>
                <div class="info-section">
                    <h2>上次运行状态</h2>
                    <div class="info-item">
                        <span class="label">时间:</span>
                        <span class="value" id="lastRunTime"></span>
                    </div>
                </div>
            </div>
        </div>

        <footer class="footer">
            <span>版本 1.0.0</span>
        </footer>
    </div>
    <script src="popup.js"></script>
</body>

</html>
